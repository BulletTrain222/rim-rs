[workspace]
resolver = "3"
members = [
    "crates/rimworld_assets",
    "crates/rimworld_defs",
    "crates/rimworld_sim",
    "crates/rimworld_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rimworld_assets = { path = "crates/rimworld_assets" }
rimworld_defs = { path = "crates/rimworld_defs" }
rimworld_sim = { path = "crates/rimworld_sim" }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tempfile = "3"
bevy = "0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow in pure debug builds; optimise dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
